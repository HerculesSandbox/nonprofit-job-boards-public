# Opens a pull request automatically whenever Claude (or anyone) pushes a work branch,
# so the owner only has to review and merge, never click "Create pull request".

name: Open pull request

on:
  push:
    # Every branch except main itself and the results/... side branches the builds write to.
    branches-ignore:
      - main
      - "results/**"

# Lets the workflow read the code and open pull requests with GitHub's built-in token.
permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    # Opening a PR takes seconds; 5 minutes is a safety limit.
    timeout-minutes: 5
    steps:
      # gh's --fill reads the branch's commit messages from a local copy of the code, so check
      # it out with full history ("fetch-depth: 0") to compare against main.
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Open a pull request if this branch doesn't have one
        env:
          # The gh command-line tool (preinstalled on GitHub's computers) logs in with this token.
          GH_TOKEN: ${{ github.token }}
          # The branch that was just pushed.
          BRANCH: ${{ github.ref_name }}
        run: |
          # Count open PRs from this branch; if there's already one, there's nothing to do.
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" != "0" ]; then
            echo "A pull request for $BRANCH is already open."
            exit 0
          fi
          # Otherwise open one into main. --fill uses the branch's commit messages as the
          # title and description, which Claude writes to explain the change.
          gh pr create --base main --head "$BRANCH" --fill
